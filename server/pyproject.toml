[project]
name = "archie-mcp"
version = "0.4.1"
description = "Archie - typed MCP server for architectural editing in SketchUp, with snapshot versioning and client/project management"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp; stay on 1.x until we migrate.
    "mcp[cli]>=1.3.0,<2",
]

[project.scripts]
archie-mcp = "archie_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archie_mcp*"]
